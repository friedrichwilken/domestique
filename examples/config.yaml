# Copy to $DOMESTIQUE_HOME/config.yaml (default ~/.config/domestique/config.yaml).
# Nothing in this file is read from the repo at run time.
athlete_id: "i000000"          # intervals.icu athlete id
timezone: "Europe/Berlin"
bedtime: "22:30"
hr_max: 190
baselines:
  hrv: 80
  rhr: 50
intent_dir: "~/.config/domestique/intent"
database_url: "postgresql://domestique:domestique@localhost:5432/domestique"
write_comments: false           # post debriefs as activity comments (default false)
overshoot_margin_pp: 10         # plan vs execution: work HR above prescription by more pp asks (default 10)
# Secrets never go in this file. Environment variables:
#   ICU_API_KEY            intervals.icu API key
#   DOMESTIQUE_HUMAN_TOKEN token required by confirm_or_retire on the claims MCP
