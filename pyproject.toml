[project]
name = "domestique"
version = "0.0.0"
description = "Training-analysis assistant for endurance athletes: the athlete stays in charge."
requires-python = ">=3.12"
dependencies = ["httpx", "psycopg[binary]", "pydantic", "pyyaml", "anthropic", "mcp>=1.2,<2"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
